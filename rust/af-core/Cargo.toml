[package]
name = "af-core"
version = "0.2.0"
edition = "2021"
description = "AeroForge Core: Aerospace Reality Intelligence and Uncertainty Management"

[lib]
name = "af_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.20.0", features = ["extension-module", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
